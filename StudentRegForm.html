<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
  <legend>Student Registration Form </legend>
  
     <!-- <h1>Student Registration Form</h1> -->
     <form>
        <label for="name"> Name: </label>
    <input type="text" name="name" id="name" placeholder="Write your name" required> <br><br>

  <label for="email"> Email: </label>
    <input type="email" name="email" id="email" placeholder="Write your email" required> <br><br>

     <label for="Password"> Password: </label>
    <input type="password" name="Password" id="Password" placeholder="Write your password" required> <br><br>

<label>Age:</label>
<input type="number" name="age"  max="100">
<br><br>
<label>Date of Birth:</label>
<input type="date" name="dob"> <br><br>

<label>Gender:</label>
<input type="radio" name="gender" value="male"> Male
<input type="radio" name="gender" value="female"> Female
<input type="radio" name="gender" value="other"> Other 
<br><br>

<label>City:</label>
<select name="city">
  <option value="dhaka">Dhaka</option>
  <option value="khulna">Khulna</option>
  <option value="Rajshahi">Rajshahi</option>
  <option value="Sylhet">Sylhet</option>
</select> <br><br>

<label>Hobbies:</label>
<input type="checkbox" name="Reading" value="Reading"> Reading
<input type="checkbox" name="Cricket" value="Cricket"> Cricket
<input type="checkbox" name="Reading" value="Reading"> Reading <br><br>

<label>About Yourself:</label><br>
<textarea name="About Yourself" rows="4" cols="40"></textarea> <br><br>

<input type="reset" value="Reset">  <input type="Submit" value="Submit">

     </form>

     </fieldset>
</body>
</html>
